<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Миний дэлгүүр</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
    header { background: #2b6cb0; color: #fff; padding: 20px; text-align: center; }
    main { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; padding: 30px 16px; }
    .product { background: #fff; border-radius: 8px; padding: 20px; width: 220px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
    .product h2 { font-size: 1.2rem; margin: 0 0 10px; }
    .price { font-size: 1.1rem; font-weight: bold; color: #2b6cb0; margin-bottom: 14px; }
    .old-price { color: #888; font-weight: normal; margin-right: 6px; }
    button { background: #2b6cb0; color: #fff; border: 0; padding: 10px 18px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #245a96; }
  </style>
</head>
<body>
  <header>
    <h1>Миний онлайн дэлгүүр</h1>
  </header>
  <main>
    <div class="product">
      <h2>Цамц</h2>
      <div class="price"><s class="old-price">25,000₮</s> 20,000₮</div>
      <button>Сагсанд нэмэх</button>
    </div>
    <div class="product">
      <h2>Пүүз</h2>
      <div class="price">80,000₮</div>
      <button>Сагсанд нэмэх</button>
    </div>
  </main>
</body>
</html>
